[workspace]
members = [
    "crates/ndf-core",
    "crates/ndf-compiler",
    "crates/ndf-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "Apache-2.0"

[workspace.dependencies]
assert_cmd = "=2.2.2"
clap = { version = "=4.6.6", features = ["derive"] }
globset = "=0.4.20"
ndf-core = { path = "crates/ndf-core" }
ndf-compiler = { path = "crates/ndf-compiler" }
predicates = "=3.1.4"
pulldown-cmark = "=0.13.4"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
walkdir = "=2.5.0"
